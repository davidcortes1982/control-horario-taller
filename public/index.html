<!-- Sección de Historial Personal (Operario) -->
<div style="margin-top: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h3>Mis Fichajes (Operario)</h3>
    <p style="font-size: 13px; color: #666;">Introduce tus credenciales para consultar tu propio registro de jornada.</p>
    <input type="email" id="op-email" placeholder="Tu correo" style="padding: 6px; margin-right: 5px;">
    <input type="password" id="op-password" placeholder="Tu contraseña" style="padding: 6px; margin-right: 5px;">
    <button onclick="cargarMiHistorial()" style="padding: 6px 12px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer;">Ver mi historial</button>
    
    <div style="max-height: 200px; overflow-y: auto; margin-top: 10px;">
        <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
            <thead>
                <tr style="background: #f1f1f1;">
                    <th style="padding: 6px;">Centro</th>
                    <th style="padding: 6px;">Tipo</th>
                    <th style="padding: 6px;">Fecha y Hora</th>
                </tr>
            </thead>
            <tbody id="tabla-mi-historial-body"></tbody>
        </table>
    </div>
</div>

<!-- Sección de Panel de Inspección (Empresario) -->
<div style="margin-top: 30px; padding: 20px; border: 2px dashed #007bff; border-radius: 8px; background: #f9fbfd;">
    <h3 style="color: #007bff;">Panel de Inspección y Control Global (Empresario)</h3>
    <p style="font-size: 13px; color: #666;">Acceso restringido para el cumplimiento de las obligaciones legales y de inspección.</p>
    <div style="margin-bottom: 15px;">
        <input type="password" id="admin-password" placeholder="Contraseña de empresario" style="padding: 8px; margin-right: 5px;">
        <button onclick="cargarFichajesEmpresario()" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Cargar Todos los Registros</button>
        <button onclick="exportarCSV()" style="padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Exportar para Inspección (CSV)</button>
    </div>

    <div style="max-height: 250px; overflow-y: auto;">
        <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
            <thead>
                <tr style="background: #e9ecef;">
                    <th style="padding: 6px;">Correo</th>
                    <th style="padding: 6px;">Centro</th>
                    <th style="padding: 6px;">Tipo</th>
                    <th style="padding: 6px;">Fecha y Hora</th>
                    <th style="padding: 6px;">GPS</th>
                </tr>
            </thead>
            <tbody id="lista-fichajes-body"></tbody>
        </table>
    </div>
</div>

<script>
    let fichajesGlobalesEmpresario = [];

    async function cargarMiHistorial() {
        const email = document.getElementById('op-email').value;
        const password = document.getElementById('op-password').value;

        try {
            const res = await fetch('/api/operario/historial', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }

            const tbody = document.getElementById('tabla-mi-historial-body');
            tbody.innerHTML = '';
            data.fichajes.forEach(f => {
                tbody.innerHTML += `<tr>
                    <td style="padding: 5px;">${f.ubicacion}</td>
                    <td style="padding: 5px;"><b>${f.tipo}</b></td>
                    <td style="padding: 5px;">${new Date(f.fecha).toLocaleString('es-ES')}</td>
                </tr>`;
            });
        } catch (e) {
            alert("Error al conectar con el servidor.");
        }
    }

    async function cargarFichajesEmpresario() {
        const password = document.getElementById('admin-password').value;
        try {
            const res = await fetch('/api/empresario/fichajes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }

            fichajesGlobalesEmpresario = data.fichajes;
            const tbody = document.getElementById('lista-fichajes-body');
            tbody.innerHTML = '';
            data.fichajes.forEach(f => {
                tbody.innerHTML += `<tr>
                    <td style="padding: 5px;">${f.email}</td>
                    <td style="padding: 5px;">${f.ubicacion}</td>
                    <td style="padding: 5px;"><b>${f.tipo}</b></td>
                    <td style="padding: 5px;">${new Date(f.fecha).toLocaleString('es-ES')}</td>
                    <td style="padding: 5px; font-size: 10px;">${f.latitud}, ${f.longitud}</td>
                </tr>`;
            });
            alert("Datos globales cargados correctamente.");
        } catch (e) {
            alert("Error de conexión.");
        }
    }

    function exportarCSV() {
        if (fichajesGlobalesEmpresario.length === 0) {
            alert("Primero debes cargar los fichajes con la contraseña de empresario.");
            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,Correo,Centro,Tipo,FechaHora,Latitud,Longitud\r\n";
        fichajesGlobalesEmpresario.forEach(f => {
            csvContent += [f.email, f.ubicacion, f.tipo, f.fecha, f.latitud, f.longitud].join(",") + "\r\n";
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `inspeccion_fichajes_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
