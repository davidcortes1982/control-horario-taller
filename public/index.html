<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Horario - Taller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2, h3 {
            color: #333;
            text-align: center;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-registro {
            background-color: #28a745;
        }
        .btn-registro:hover {
            background-color: #218838;
        }
        #mensaje, #reg-mensaje {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }
        .seccion {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control Horario</h2>

    <!-- INICIO DE SESIÓN Y FICHAJE -->
    <div class="seccion">
        <h3>Iniciar Sesión y Fichar</h3>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">

        <label for="ubicacion">Centro de Trabajo:</label>
        <select id="ubicacion">
            <option value="taller">Taller Principal</option>
            <option value="avanza">Avanza</option>
            <option value="casa">Pruebas Casa</option>
        </select>

        <label for="tipo">Tipo de Fichaje:</label>
        <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
        </select>

        <button onclick="fichar()">Fichar con GPS</button>
        <p id="mensaje"></p>
    </div>

    <!-- REGISTRO DE NUEVOS USUARIOS -->
    <div>
        <h3>¿No tienes cuenta? Regístrate</h3>
        <input type="email" id="reg-email" placeholder="Correo electrónico">
        <input type="password" id="reg-password" placeholder="Contraseña">
        <button class="btn-registro" onclick="registrarUsuario()">Crear Cuenta</button>
        <p id="reg-mensaje"></p>
    </div>
</div>

<script>
    // Función para Fichar
    async function fichar() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const ubicacion = document.getElementById('ubicacion').value;
        const tipo = document.getElementById('tipo').value;
        const mensaje = document.getElementById('mensaje');

        mensaje.style.color = '#333';
        mensaje.textContent = "Obteniendo ubicación GPS...";

        if (!navigator.geolocation) {
            mensaje.style.color = 'red';
            mensaje.textContent = "Tu navegador no soporta geolocalización.";
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const latitud = position.coords.latitude;
            const longitud = position.coords.longitude;

            mensaje.textContent = "Enviando fichaje...";

            try {
                const respuesta = await fetch('/api/fichar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, ubicacion, tipo, latitud, longitud })
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.style.color = 'green';
                    mensaje.textContent = resultado.message;
                } else {
                    mensaje.style.color = 'red';
                    mensaje.textContent = resultado.error || "Error al fichar";
                }
            } catch (error) {
                mensaje.style.color = 'red';
                mensaje.textContent = "Error de conexión con el servidor.";
            }
        }, (error) => {
            mensaje.style.color = 'red';
            mensaje.textContent = "No se pudo obtener el GPS. Activa la ubicación en tu dispositivo.";
        }, { enableHighAccuracy: true });
    }

    // Función para Registrar Usuario
    async function registrarUsuario() {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const mensaje = document.getElementById('reg-mensaje');

        try {
            const respuesta = await fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const resultado = await respuesta.json();
            if (respuesta.ok) {
                mensaje.style.color = 'green';
                mensaje.textContent = "¡Registrado con éxito! Ya puedes iniciar sesión arriba.";
            } else {
                mensaje.style.color = 'red';
                mensaje.textContent = resultado.error || "Error al registrarse";
            }
        } catch (error) {
            mensaje.style.color = 'red';
            mensaje.textContent = "Error de conexión con el servidor.";
        }
    }
</script>

</body>
</html>
