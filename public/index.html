<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Horario - Taller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Fichaje Taller</h2>
        <form id="form-fichaje">
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="tu.correo@taller.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="nave_select">Centro de Trabajo / Ubicación:</label>
                <select id="nave_select" required>
                    <option value="1">Taller Principal</option>
                    <option value="2">Cliente Avanza</option>
                    <option value="3">Pruebas Casa</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo_select">Tipo de Fichaje:</label>
                <select id="tipo_select" required>
                    <option value="entrada">Entrada</option>
                    <option value="salida">Salida</option>
                </select>
            </div>

            <button type="submit">Fichar Ahora</button>
        </form>
    </div>

    <script>
        // Capturar el envío del formulario
        document.getElementById('form-fichaje').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const naveId = document.getElementById('nave_select').value;
            const tipoFichaje = document.getElementById('tipo_select').value;

            enviarFichajeConGPS(email, password, naveId, tipoFichaje);
        });

        // Función de envío con geolocalización GPS
        function enviarFichajeConGPS(email, password, naveId, tipoFichaje) {
            // Comprobar si el navegador permite geolocalización
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            // Pedir la posición exacta al móvil
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // Enviar los datos junto con la latitud y longitud al servidor
                    fetch('/api/fichar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            nave_id: naveId,
                            tipo: tipoFichaje,
                            lat: lat,
                            lon: lon
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.exito) {
                            alert(`¡Fichaje exitoso a las ${data.hora}!`);
                        } else {
                            alert(`Error: ${data.error}`);
                        }
                    })
                    .catch(err => alert("Error de conexión con el servidor."));
                },
                (error) => {
                    alert("Debes activar y permitir el acceso al GPS para poder fichar.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>
</body>
</html>
